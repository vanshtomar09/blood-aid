spring:
  application:
    name: bloodaid
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bloodaid}
    username: ${DB_USERNAME:bloodaid}
    password: ${DB_PASSWORD:bloodaid}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    mapper:
      accept-case-insensitive-enums: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # Must be at least 32 characters. Set JWT_SECRET in any real deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  seed:
    # Creates demo accounts (admin/staff/donor/recipient) on startup if they do not exist.
    enabled: ${APP_SEED_ENABLED:true}
  otp:
    # Only used when no mail host is configured: the code is then returned in the API response so the demo
    # can be completed. With MAIL_HOST set, codes are emailed and never returned.
    demo: ${APP_DEMO_OTP:true}
  mail:
    # Leave MAIL_HOST empty to run without email. Gmail: smtp.gmail.com, 587, an app password.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}

gemini:
  # Leave empty to run without AI: the chatbot and forecast use built-in fallbacks.
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
